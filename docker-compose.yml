services:
  postgres:
    image: postgres:16-alpine
    container_name: fulfillio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fulfillio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fulfillio_secret}
      POSTGRES_DB: ${POSTGRES_DB:-fulfillio_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fulfillio} -d ${POSTGRES_DB:-fulfillio_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fulfillio-network

  redis:
    image: redis:7-alpine
    container_name: fulfillio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fulfillio-network

  # Reverse Proxy with automatic HTTPS for fulfillio.online
  caddy:
    image: caddy:2-alpine
    container_name: fulfillio-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - fulfillio-network

  # Background Asynchronous Job Worker (PDF rendering, Courier booking, Webhooks)
  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: fulfillio-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-fulfillio}:${POSTGRES_PASSWORD:-fulfillio_secret}@postgres:5432/${POSTGRES_DB:-fulfillio_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      INVOICES_DIR: /app/uploads/invoices
      STEADFAST_API_KEY: ${STEADFAST_API_KEY:-}
      STEADFAST_SECRET_KEY: ${STEADFAST_SECRET_KEY:-}
      PATHAO_CLIENT_ID: ${PATHAO_CLIENT_ID:-}
      PATHAO_CLIENT_SECRET: ${PATHAO_CLIENT_SECRET:-}
      REDX_API_TOKEN: ${REDX_API_TOKEN:-}
    volumes:
      - ./uploads/invoices:/app/uploads/invoices
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fulfillio-network

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  fulfillio-network:
    driver: bridge
